version: '3.8'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./database:/database
    networks:
      - gt-network

  # GT Question Generator Application
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_SERVER=sqlserver
      - DB_NAME=GTQuestionDB
      - DB_USER=sa
      - DB_PASSWORD=YourStrong@Passw0rd
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_ENV=production
    volumes:
      - ./app/static/images:/app/app/static/images
      - ./logs:/app/logs
    depends_on:
      - sqlserver
    networks:
      - gt-network
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - gt-network
    restart: unless-stopped

volumes:
  sqlserver_data:

networks:
  gt-network:
    driver: bridge 